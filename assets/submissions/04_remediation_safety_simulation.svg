      <text x="16" y="24" fill="#38bdf8" font-size="11" font-weight="bold">EXECUTION AUDIT LOG</text>
      
      <text x="16" y="48" fill="#94a3b8" font-size="10" font-family="monospace">[10:25:02] Token validated against AWS KMS signing key.</text>
      <text x="16" y="68" fill="#10b981" font-size="10" font-family="monospace">[10:25:04] ECS API: Updating service with task definition v41...</text>
      <text x="16" y="88" fill="#10b981" font-size="10" font-family="monospace">[10:25:38] Healthy replacement tasks in service. 5XX rate: 0.00%.</text>
    </g>

    <!-- Bottom Action Button / Status -->
    <g transform="translate(24, 445)">
      <rect x="0" y="0" width="487" height="50" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.5" />
      <text x="243" y="30" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">✓ PRODUCTION REMEDIATION SUCCESSFULLY COMPLETED</text>
    </g>
