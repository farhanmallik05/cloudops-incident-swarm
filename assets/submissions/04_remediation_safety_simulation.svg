    <text x="24" y="55" fill="#94a3b8" font-size="11">Pre-execution blast radius verification before production invocation</text>

    <!-- Simulation Check 1 -->
    <g transform="translate(24, 75)">
      <rect x="0" y="0" width="472" height="64" rx="10" fill="#111827" stroke="#10b981" />
      <circle cx="28" cy="32" r="14" fill="#064e3b" />
      <text x="28" y="37" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
      <text x="55" y="26" fill="#f8fafc" font-size="12" font-weight="bold">Target Task Definition Validation</text>
      <text x="55" y="44" fill="#94a3b8" font-size="10">payment-service:v41 verified healthy in staging environment</text>
      <text x="450" y="36" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">PASS</text>
    </g>

    <!-- Simulation Check 2 -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="472" height="64" rx="10" fill="#111827" stroke="#10b981" />
      <circle cx="28" cy="32" r="14" fill="#064e3b" />
      <text x="28" y="37" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
      <text x="55" y="26" fill="#f8fafc" font-size="12" font-weight="bold">Zero-Downtime Rolling Update Strategy</text>
      <text x="55" y="44" fill="#94a3b8" font-size="10">Minimum healthy percent: 100% | Maximum percent: 200%</text>
      <text x="450" y="36" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">PASS</text>
    </g>

    <!-- Simulation Check 3 -->
    <g transform="translate(24, 225)">
      <rect x="0" y="0" width="472" height="64" rx="10" fill="#111827" stroke="#10b981" />
      <circle cx="28" cy="32" r="14" fill="#064e3b" />
      <text x="28" y="37" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
      <text x="55" y="26" fill="#f8fafc" font-size="12" font-weight="bold">Database Migration Reversibility</text>
      <text x="55" y="44" fill="#94a3b8" font-size="10">No destructive schema alterations detected between v41 and v42</text>
      <text x="450" y="36" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">PASS</text>
    </g>

    <!-- Simulation Check 4 -->
    <g transform="translate(24, 300)">
      <rect x="0" y="0" width="472" height="64" rx="10" fill="#111827" stroke="#10b981" />
      <circle cx="28" cy="32" r="14" fill="#064e3b" />
      <text x="28" y="37" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
      <text x="55" y="26" fill="#f8fafc" font-size="12" font-weight="bold">IAM Role Least Privilege Guardrail</text>
      <text x="55" y="44" fill="#94a3b8" font-size="10">Service principal constrained strictly to ecs:UpdateService ARN</text>
      <text x="450" y="36" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">PASS</text>
