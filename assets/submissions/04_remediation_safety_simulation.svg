        <text x="0" y="35" fill="#f8fafc">{</text>
        <text x="15" y="55" fill="#38bdf8">"incident_id":</text> <text x="130" y="55" fill="#cbd5e1">"INC-84920-PAYMENTS",</text>
        <text x="15" y="75" fill="#38bdf8">"target_action":</text> <text x="140" y="75" fill="#cbd5e1">"ECS_SERVICE_ROLLBACK",</text>
        <text x="15" y="95" fill="#38bdf8">"cluster":</text> <text x="95" y="95" fill="#cbd5e1">"prod-us-east-1",</text>
        <text x="15" y="115" fill="#38bdf8">"rollback_target":</text> <text x="160" y="115" fill="#cbd5e1">"payment-service:41",</text>
        <text x="15" y="135" fill="#38bdf8">"hmac_sha256":</text> <text x="130" y="135" fill="#f59e0b">"a9b8f2...c89e1a",</text>
        <text x="15" y="155" fill="#38bdf8">"authorized_by":</text> <text x="145" y="155" fill="#10b981">"oncall-sre@company.com",</text>
        <text x="15" y="175" fill="#38bdf8">"token_expiry":</text> <text x="135" y="175" fill="#cbd5e1">"2026-10-31T10:35:00Z"</text>
        <text x="0" y="195" fill="#f8fafc">}</text>
      </g>
    </g>

