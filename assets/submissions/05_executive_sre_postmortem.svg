  <!-- Right: Incident Post-Mortem Report Document -->
  <g transform="translate(485, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="655" height="520" rx="14" fill="url(#docBg)" stroke="#1e293b" />

    <!-- Document Header -->
