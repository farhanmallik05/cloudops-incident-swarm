    <rect x="25" y="16" width="36" height="32" rx="8" fill="#1e1b4b" stroke="#6366f1" />
    <text x="43" y="38" fill="#c7d2fe" font-size="16" text-anchor="middle">👑</text>

    <text x="75" y="38" fill="#f8fafc" font-size="16" font-weight="bold">Commander Agent • Executive SRE Incident Post-Mortem &amp; Audit Report</text>
    <text x="760" y="38" fill="#94a3b8" font-size="12">Incident ID: INC-84920 • Severity: P1 (Resolved)</text>

    <!-- Export Badges -->
    <rect x="945" y="16" width="110" height="32" rx="8" fill="#064e3b" stroke="#10b981" />
