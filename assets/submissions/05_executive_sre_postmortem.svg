    <g transform="translate(24, 85)">
      <text x="0" y="15" fill="#94a3b8" font-size="11">Traditional On-Call Engineer Workflow:</text>
      <rect x="0" y="25" width="350" height="32" rx="6" fill="#1f2937" />
      <rect x="0" y="25" width="320" height="32" rx="6" fill="#ef4444" fill-opacity="0.8" />
      <text x="15" y="46" fill="#ffffff" font-size="12" font-weight="bold">42.0 Minutes</text>
      <text x="310" y="46" fill="#fecaca" font-size="11" text-anchor="end">Alert → Pager → Manual Logs → Patch</text>

      <text x="0" y="90" fill="#94a3b8" font-size="11">Strands SDK Autonomous Agent Swarm:</text>
      <rect x="0" y="100" width="350" height="32" rx="6" fill="#1f2937" />
      <rect x="0" y="100" width="45" height="32" rx="6" fill="#10b981" />
      <text x="60" y="121" fill="#34d399" font-size="14" font-weight="bold">4.2 Minutes <tspan fill="#a7f3d0" font-size="11">(-90% Downtime!)</tspan></text>

      <line x1="0" y1="155" x2="350" y2="155" stroke="#1e293b" />

      <!-- Token Cost Accounting Card -->
      <text x="0" y="185" fill="#f8fafc" font-size="12" font-weight="bold">BEDROCK SWARM COST ACCOUNTING</text>
      
      <rect x="0" y="200" width="352" height="135" rx="10" fill="#0b1329" stroke="#1e293b" />
      
      <text x="15" y="225" fill="#94a3b8" font-size="11">Triage Agent (Claude 3.5 Haiku):</text>
      <text x="335" y="225" fill="#cbd5e1" font-size="11" text-anchor="end">4,120 tok ($0.004)</text>

      <text x="15" y="250" fill="#94a3b8" font-size="11">Diagnostic Agent (Claude 3.5 Sonnet):</text>
      <text x="335" y="250" fill="#cbd5e1" font-size="11" text-anchor="end">8,450 tok ($0.025)</text>

      <text x="15" y="275" fill="#94a3b8" font-size="11">Remediation Agent (Claude 3.5 Sonnet):</text>
      <text x="335" y="275" fill="#cbd5e1" font-size="11" text-anchor="end">3,200 tok ($0.009)</text>

      <line x1="15" y1="290" x2="335" y2="290" stroke="#1e293b" />

      <text x="15" y="315" fill="#10b981" font-size="12" font-weight="bold">Total Swarm Resolution Cost:</text>
      <text x="335" y="315" fill="#10b981" font-size="14" font-weight="bold" text-anchor="end">$0.038 USD</text>

