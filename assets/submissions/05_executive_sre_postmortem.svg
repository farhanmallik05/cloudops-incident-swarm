    <rect x="0" y="30" width="655" height="12" fill="#1e293b" />
    <text x="24" y="26" fill="#f8fafc" font-size="13" font-weight="bold">📄 INCIDENT-84920-POSTMORTEM.md (Synthesized by Commander)</text>

    <!-- Report Body -->
    <g transform="translate(25, 60)" font-size="11.5">
      <text x="0" y="15" fill="#f8fafc" font-weight="bold">1. Executive Summary</text>
      <text x="0" y="35" fill="#94a3b8">At 10:22 UTC, the payment gateway experienced a total outage (42.8% 504 errors)</text>
      <text x="0" y="53" fill="#94a3b8">following the release of PR #142. The Strands SRE agent swarm autonomously diagnosed</text>
      <text x="0" y="71" fill="#94a3b8">the connection pool leak and successfully executed a blue/green rollback to task v41.</text>

      <text x="0" y="105" fill="#f8fafc" font-weight="bold">2. Incident Timeline</text>
      <g transform="translate(0, 115)" font-family="monospace" font-size="10.5">
        <text x="0" y="15" fill="#64748b">• 10:20:00 UTC</text> <text x="120" y="15" fill="#cbd5e1">PR #142 deployed to ECS production cluster.</text>
        <text x="0" y="35" fill="#64748b">• 10:22:15 UTC</text> <text x="120" y="35" fill="#ef4444">CloudWatch alarm triggers P1: 5XX &gt; 1% threshold.</text>
        <text x="0" y="55" fill="#64748b">• 10:22:30 UTC</text> <text x="120" y="55" fill="#10b981">Triage Specialist streams logs &amp; isolates db pool timeouts.</text>
        <text x="0" y="75" fill="#64748b">• 10:23:10 UTC</text> <text x="120" y="75" fill="#d946ef">Diagnostic Specialist pinpoints leaked conn at db.py:58.</text>
        <text x="0" y="95" fill="#64748b">• 10:24:45 UTC</text> <text x="120" y="95" fill="#f59e0b">HMAC authorization token approved by human SRE lead.</text>
        <text x="0" y="115" fill="#64748b">• 10:25:38 UTC</text> <text x="120" y="115" fill="#10b981">ECS service rollback completed. Error rate restored to 0.00%.</text>
      </g>

      <text x="0" y="260" fill="#f8fafc" font-weight="bold">3. Preventative Action Items</text>
      <rect x="0" y="272" width="605" height="100" rx="8" fill="#111827" stroke="#374151" />
      <g transform="translate(15, 290)" font-size="11">
        <text x="0" y="0" fill="#38bdf8">1. [P0 Action Item] Codify static lint rule forbidding manual pool.acquire() calls.</text>
        <text x="0" y="22" fill="#38bdf8">2. [P1 Action Item] Deploy automated Chaos Engineering pool saturation canary.</text>
        <text x="0" y="44" fill="#38bdf8">3. [P2 Action Item] Lower CloudWatch connection pool warning threshold to 70%.</text>
        <text x="0" y="66" fill="#10b981">✓ All action items registered in Jira (PROJ-9481) and Slack (#ops-war-room).</text>
      </g>

      <!-- Signature block -->
      <g transform="translate(0, 395)">
        <rect x="0" y="0" width="605" height="50" rx="8" fill="#042f2e" stroke="#059669" />
        <text x="15" y="24" fill="#5eead4" font-weight="bold">ORCHESTRATED BY STRANDS MULTI-AGENT SWARM (AWS WORKSHOP TO SHIP)</text>
        <text x="15" y="40" fill="#ccfbf1" font-size="10">Supervised by: Commander Agent | Verified by: Human SRE On-Call Lead</text>
      </g>
