      <text x="15" y="380" fill="#34d399" font-size="11" font-weight="bold">ESTIMATED DOWNTIME COST SAVINGS:</text>
      <text x="15" y="402" fill="#ccfbf1" font-size="13" font-weight="bold">&gt; $18,500 Saved <tspan font-weight="normal" font-size="10">(based on $500/min ecommerce outage)</tspan></text>
