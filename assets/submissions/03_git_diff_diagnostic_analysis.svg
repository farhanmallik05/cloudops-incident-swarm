<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <defs>
    <linearGradient id="diffBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#090d16" />

  <!-- Top Header Bar -->
  <g transform="translate(60, 30)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="64" rx="14" fill="#0f172a" stroke="#1e293b" />
    
    <rect x="25" y="16" width="36" height="32" rx="8" fill="#701a75" />
    <text x="43" y="38" fill="#f5d0fe" font-size="16" text-anchor="middle">🔬</text>

    <text x="75" y="38" fill="#f8fafc" font-size="16" font-weight="bold">Diagnostic Specialist • Automated Root-Cause Git Diff Engine</text>
    <text x="680" y="38" fill="#94a3b8" font-size="12">Commit: e4b29fa • PR #142: "perf(db): optimize payment queries"</text>

    <!-- Confidence Pill -->
    <rect x="925" y="16" width="130" height="32" rx="8" fill="#4a044e" stroke="#d946ef" />
    <text x="990" y="36" fill="#f0abfc" font-size="11" font-weight="bold" text-anchor="middle">CONFIDENCE: 98%</text>
  </g>

  <!-- Left: Suspect Git Commit & Diff Analysis -->
  <g transform="translate(60, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="670" height="520" rx="14" fill="url(#diffBg)" stroke="#1e293b" />

    <!-- File Diff Header -->
    <rect x="0" y="0" width="670" height="42" rx="14" fill="#1e293b" />
    <rect x="0" y="30" width="670" height="12" fill="#1e293b" />
    <text x="24" y="26" fill="#f8fafc" font-size="12" font-weight="bold">diff --git a/services/payment/db.py b/services/payment/db.py</text>
    <text x="560" y="26" fill="#94a3b8" font-size="11">Lines 42–68</text>

    <!-- Code Diff Area -->
    <g transform="translate(20, 60)" font-size="11">
      <text x="0" y="20" fill="#64748b">@@ -45,18 +45,21 @@ async def execute_payment_transaction(payload):</text>
      <text x="0" y="44" fill="#94a3b8">     logger.info(f"Processing payment tx for user {payload.user_id}")</text>
      <text x="0" y="68" fill="#94a3b8">     pool = await get_connection_pool()</text>
      
      <!-- Modified lines -->
      <rect x="-10" y="80" width="640" height="24" fill="#450a0a" />
      <text x="0" y="96" fill="#fca5a5">-    async with pool.acquire() as conn:  # Context manager auto-releases</text>

      <rect x="-10" y="104" width="640" height="24" fill="#042f2e" />
      <text x="0" y="120" fill="#5eead4">+    conn = await pool.acquire()         # MANUAL ACQUIRE (VULNERABLE)</text>

      <text x="0" y="144" fill="#94a3b8">     try:</text>
      <text x="0" y="168" fill="#94a3b8">         result = await conn.execute("UPDATE accounts SET balance = ...")</text>
      <text x="0" y="192" fill="#94a3b8">         if result.status == "DECLINED":</text>

      <!-- Bug culprit line -->
      <rect x="-10" y="204" width="640" height="24" fill="#450a0a" />
      <text x="0" y="220" fill="#fca5a5" font-weight="bold">-            raise PaymentDeclinedException("Card declined by issuer")</text>

      <rect x="-10" y="228" width="640" height="24" fill="#042f2e" />
      <text x="0" y="244" fill="#5eead4">+            raise PaymentDeclinedException("Card declined by issuer") # [BUG: NEVER RELEASES CONN!]</text>

      <text x="0" y="268" fill="#94a3b8">     except Exception as exc:</text>
      <text x="0" y="292" fill="#94a3b8">         logger.error(f"Transaction failed: {exc}")</text>
      <text x="0" y="316" fill="#94a3b8">         raise</text>

      <!-- Missing finally block highlight -->
      <rect x="-10" y="330" width="640" height="50" rx="6" fill="#701a75" fill-opacity="0.2" stroke="#d946ef" stroke-dasharray="4,4" />
      <text x="0" y="350" fill="#f0abfc" font-weight="bold">! MISSING: finally: await pool.release(conn)</text>
      <text x="0" y="370" fill="#e9d5ff" font-size="10">Every declined payment permanently drains 1 connection from the pool of 100.</text>
    </g>

    <!-- Bottom summary banner in diff box -->
    <g transform="translate(20, 470)">
      <rect x="0" y="0" width="630" height="36" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="15" y="22" fill="#f59e0b" font-size="11" font-weight="bold">⚠️ Impact: 100 declined transactions caused complete service blackout within 2.5 minutes.</text>
    </g>
  </g>

  <!-- Right: Diagnostic Agent Reasoning & Solution Graph -->
  <g transform="translate(755, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="385" height="520" rx="14" fill="url(#diffBg)" stroke="#1e293b" />

    <text x="24" y="35" fill="#f8fafc" font-size="14" font-weight="bold">Diagnostic Specialist Report</text>
    <text x="24" y="55" fill="#94a3b8" font-size="11">Correlated with CloudWatch metrics</text>

    <!-- Finding Card 1 -->
    <g transform="translate(24, 75)">
      <rect x="0" y="0" width="337" height="90" rx="10" fill="#111827" stroke="#374151" />
      <text x="16" y="24" fill="#f0abfc" font-size="12" font-weight="bold">Root Cause Mechanism</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="10">Unreleased database connection inside the</text>
      <text x="16" y="60" fill="#cbd5e1" font-size="10">exception branch of execute_payment_transaction.</text>
      <text x="16" y="78" fill="#a855f7" font-size="10" font-weight="bold">Target file: services/payment/db.py:58</text>
    </g>

    <!-- Finding Card 2 -->
    <g transform="translate(24, 180)">
      <rect x="0" y="0" width="337" height="90" rx="10" fill="#111827" stroke="#374151" />
      <text x="16" y="24" fill="#f0abfc" font-size="12" font-weight="bold">Regression Author &amp; Deploy Time</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="10">PR #142 merged by @junior-dev at 10:19 UTC</text>
      <text x="16" y="60" fill="#cbd5e1" font-size="10">Deployed to ECS cluster prod-us-east-1 at 10:20</text>
      <text x="16" y="78" fill="#10b981" font-size="10" font-weight="bold">Git Commit hash: e4b29fa38c92</text>
    </g>

    <!-- Finding Card 3: Prescribed Remediation -->
    <g transform="translate(24, 285)">
      <rect x="0" y="0" width="337" height="120" rx="10" fill="#042f2e" stroke="#059669" />
      <text x="16" y="24" fill="#34d399" font-size="12" font-weight="bold">Prescribed Auto-Remediation</text>
      <text x="16" y="46" fill="#ccfbf1" font-size="10">Option A: Immediate git revert to stable e2a91b</text>
      <text x="16" y="64" fill="#ccfbf1" font-size="10">Option B: Instant ECS task rollback to task def v41</text>
      <text x="16" y="82" fill="#ccfbf1" font-size="10">Option C: Live patch with async context manager</text>
      <text x="16" y="104" fill="#5eead4" font-size="10" font-weight="bold">» Recommended: Option B (fastest recovery: ~40s)</text>
    </g>

    <!-- Handoff action button -->
    <g transform="translate(24, 430)">
      <rect x="0" y="0" width="337" height="55" rx="10" fill="#701a75" stroke="#d946ef" />
      <text x="168" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">DISPATCH TO REMEDIATION AGENT</text>
      <text x="168" y="44" fill="#f5d0fe" font-size="10" text-anchor="middle">Awaiting Human-in-the-Loop signature...</text>
    </g>
  </g>
</svg>

