<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="commanderCard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="triageCard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="diagCard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#86198f" />
    </linearGradient>
    <linearGradient id="remedCard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#090d16" />

  <!-- Ambient Swarm Glows -->
  <circle cx="600" cy="180" r="280" fill="#6366f1" fill-opacity="0.08" />
  <circle cx="250" cy="450" r="220" fill="#10b981" fill-opacity="0.06" />
  <circle cx="950" cy="450" r="220" fill="#f97316" fill-opacity="0.06" />

  <!-- Header -->
  <g transform="translate(60, 30)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="64" rx="14" fill="#0f172a" stroke="#1e293b" />
    <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="bold">🛡️ Strands SDK Multi-Agent SRE Swarm Orchestration</text>
    <text x="560" y="38" fill="#94a3b8" font-size="12">Supervisor-Worker Topology • Cryptographic HITL • Amazon Bedrock Foundation</text>
    <rect x="940" y="16" width="115" height="32" rx="8" fill="#1e1b4b" stroke="#6366f1" />
    <text x="997" y="36" fill="#a5b4fc" font-size="11" font-weight="bold" text-anchor="middle">⚡ Strands Core</text>
  </g>

  <!-- Connection Lines from Commander to Specialists -->
  <g stroke-width="2.5">
    <!-- Commander to Triage -->
    <path d="M 600,240 C 600,300 230,300 230,360" fill="none" stroke="#10b981" stroke-dasharray="6,4" />
    <!-- Commander to Diagnostic -->
    <path d="M 600,240 C 600,300 600,320 600,360" fill="none" stroke="#d946ef" stroke-dasharray="6,4" />
    <!-- Commander to Remediation -->
    <path d="M 600,240 C 600,300 970,300 970,360" fill="none" stroke="#f97316" stroke-dasharray="6,4" />
  </g>

  <!-- Level 1: Commander Agent (Supervisor) -->
  <g transform="translate(420, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="120" rx="16" fill="url(#commanderCard)" stroke="#818cf8" stroke-width="2" />
    
    <g transform="translate(24, 25)">
      <circle cx="20" cy="20" r="18" fill="#4338ca" />
      <text x="20" y="26" fill="#ffffff" font-size="18" text-anchor="middle">👑</text>
      
      <text x="50" y="16" fill="#ffffff" font-size="16" font-weight="bold">Incident Commander Agent</text>
      <text x="50" y="34" fill="#c7d2fe" font-size="11">Model: Claude 3.5 Sonnet (Amazon Bedrock)</text>

      <text x="0" y="60" fill="#e0e7ff" font-size="11">• Triages incoming P1 alerts &amp; synthesizes timeline</text>
      <text x="0" y="78" fill="#e0e7ff" font-size="11">• Coordinates worker agents &amp; manages Slack/Jira state</text>
    </g>
  </g>

  <!-- Level 2: The Three Autonomous Specialists -->

  <!-- Worker 1: Triage Specialist -->
  <g transform="translate(60, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="190" rx="14" fill="url(#triageCard)" stroke="#34d399" stroke-width="1.5" />
    
    <g transform="translate(20, 24)">
      <circle cx="18" cy="18" r="16" fill="#047857" />
      <text x="18" y="23" fill="#ffffff" font-size="16" text-anchor="middle">📊</text>

      <text x="45" y="16" fill="#ffffff" font-size="14" font-weight="bold">Triage Specialist</text>
      <text x="45" y="32" fill="#a7f3d0" font-size="10">Telemetry &amp; Log Analysis</text>

      <line x1="0" y1="45" x2="300" y2="45" stroke="#047857" />

      <text x="0" y="68" fill="#d1fae5" font-size="11">🔍 <tspan font-weight="bold">CloudWatch Log Streamer</tspan></text>
      <text x="0" y="86" fill="#a7f3d0" font-size="10">Scans 5XX spikes, error signatures, &amp; metrics</text>

      <text x="0" y="112" fill="#d1fae5" font-size="11">⏱️ <tspan font-weight="bold">Anomaly Detection</tspan></text>
      <text x="0" y="130" fill="#a7f3d0" font-size="10">Detects latency regressions in p95/p99 graphs</text>

      <rect x="0" y="142" width="130" height="20" rx="6" fill="#022c22" />
      <text x="65" y="156" fill="#34d399" font-size="9" font-weight="bold" text-anchor="middle">STATUS: PASSIVE WATCH</text>
    </g>
  </g>

  <!-- Worker 2: Diagnostic Specialist -->
  <g transform="translate(430, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="190" rx="14" fill="url(#diagCard)" stroke="#f472b6" stroke-width="1.5" />
    
    <g transform="translate(20, 24)">
      <circle cx="18" cy="18" r="16" fill="#86198f" />
      <text x="18" y="23" fill="#ffffff" font-size="16" text-anchor="middle">🔬</text>

      <text x="45" y="16" fill="#ffffff" font-size="14" font-weight="bold">Diagnostic Specialist</text>
      <text x="45" y="32" fill="#fbcfe8" font-size="10">Root Cause Git &amp; Stack Inspector</text>

      <line x1="0" y1="45" x2="300" y2="45" stroke="#86198f" />

      <text x="0" y="68" fill="#fdf2f8" font-size="11">🧬 <tspan font-weight="bold">Git Diff Correlator</tspan></text>
      <text x="0" y="86" fill="#fbcfe8" font-size="10">Pinpoints suspect commits and regressions</text>

      <text x="0" y="112" fill="#fdf2f8" font-size="11">🧩 <tspan font-weight="bold">Dependency Graph Search</tspan></text>
      <text x="0" y="130" fill="#fbcfe8" font-size="10">Traces cascaded thread pool exhaustions</text>

      <rect x="0" y="142" width="130" height="20" rx="6" fill="#4a044e" />
      <text x="65" y="156" fill="#f472b6" font-size="9" font-weight="bold" text-anchor="middle">CONFIDENCE: 94.8%</text>
    </g>
  </g>

  <!-- Worker 3: Remediation Specialist -->
  <g transform="translate(800, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="190" rx="14" fill="url(#remedCard)" stroke="#fb923c" stroke-width="1.5" />
    
    <g transform="translate(20, 24)">
      <circle cx="18" cy="18" r="16" fill="#9a3412" />
      <text x="18" y="23" fill="#ffffff" font-size="16" text-anchor="middle">🛡️</text>

      <text x="45" y="16" fill="#ffffff" font-size="14" font-weight="bold">Remediation Specialist</text>
      <text x="45" y="32" fill="#ffedd5" font-size="10">Dry-Run &amp; Rollback Engine</text>

      <line x1="0" y1="45" x2="300" y2="45" stroke="#9a3412" />

      <text x="0" y="68" fill="#fff7ed" font-size="11">🧪 <tspan font-weight="bold">Sandbox Dry-Run Simulation</tspan></text>
      <text x="0" y="86" fill="#ffedd5" font-size="10">Verifies patch safety before touching prod</text>

      <text x="0" y="112" fill="#fff7ed" font-size="11">🔑 <tspan font-weight="bold">HMAC Cryptographic HITL Gate</tspan></text>
      <text x="0" y="130" fill="#ffedd5" font-size="10">Requires human signature for mutating actions</text>

      <rect x="0" y="142" width="130" height="20" rx="6" fill="#431407" />
      <text x="65" y="156" fill="#fb923c" font-size="9" font-weight="bold" text-anchor="middle">GATE: LOCKED (AWAITING HITL)</text>
    </g>
  </g>

  <!-- Bottom Safety & Grounding Banner -->
  <g transform="translate(60, 580)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="60" rx="12" fill="#020617" stroke="#1e293b" />
    <text x="30" y="35" fill="#38bdf8" font-size="13" font-weight="bold">🔒 Zero-Trust Guardrails:</text>
    <text x="210" y="35" fill="#94a3b8" font-size="12">Read-only CloudWatch access • Read-only Git blame • Cryptographic token human verification for ECS/Lambda rollbacks</text>
  </g>
</svg>

